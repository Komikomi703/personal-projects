<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ルーレットアプリ</title>
  <style>
    :root {
      --bg: #f6f1e7;
      --panel: #fffaf0;
      --card: #ffffff;
      --text: #17202c;
      --muted: #667085;
      --line: #d8cfbf;
      --main: #e94b35;
      --main-dark: #b93628;
      --danger: #b42318;
      --shadow: 0 18px 40px rgba(30, 25, 16, 0.16);
    }

    body[data-theme="festival"] {
      --bg: #fff4d7;
      --panel: #fff9ec;
      --card: #ffffff;
      --text: #1f2633;
      --muted: #667085;
      --line: #e0c99b;
      --main: #d23f6f;
      --main-dark: #9e294e;
      --danger: #b42318;
    }

    body[data-theme="night"] {
      --bg: #11131a;
      --panel: #181c25;
      --card: #222938;
      --text: #edf1f7;
      --muted: #a8b0be;
      --line: #343b49;
      --main: #f0b84b;
      --main-dark: #cb7d1c;
      --danger: #ff7670;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    }

    button,
    input,
    select {
      min-width: 0;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px;
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .logo {
      min-width: 0;
    }

    .logo p {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1;
      white-space: nowrap;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .wheel-menu {
      display: grid;
      grid-template-columns: auto minmax(180px, 260px) 40px 40px 40px;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }

    .wheel-menu label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    select,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      padding: 0 12px;
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      padding: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) minmax(0, 0.7fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .wheel-name {
      height: 46px;
      font-size: 20px;
      font-weight: 900;
    }

    .save-status {
      min-width: 72px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: right;
    }

    .tool-btn,
    .small-btn,
    .sub-btn,
    .spin-btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-weight: 900;
    }

    .tool-btn {
      width: 40px;
      padding: 0;
      font-size: 18px;
    }

    .danger {
      color: var(--danger);
    }

    .wheel-box {
      position: relative;
      width: min(72vh, 100%);
      max-width: 640px;
      aspect-ratio: 1;
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.22));
    }

    .pointer {
      position: absolute;
      top: 50%;
      right: -4px;
      z-index: 3;
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 32px solid var(--text);
      transform: translateY(-50%);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      width: 24%;
      aspect-ratio: 1;
      border: 8px solid var(--panel);
      border-radius: 50%;
      background: var(--text);
      color: var(--card);
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .center strong {
      display: block;
      font-size: clamp(24px, 5vw, 40px);
      line-height: 1;
    }

    .center span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      opacity: 0.8;
    }

    .probability {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .mini-pie {
      position: relative;
      width: 96px;
      aspect-ratio: 1;
      border: 5px solid var(--text);
      border-radius: 50%;
      background: conic-gradient(#b9c0ca 0deg 360deg);
    }

    .mini-pie::after {
      position: absolute;
      inset: 28%;
      border-radius: 50%;
      background: var(--panel);
      content: "";
    }

    .probability-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .probability-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 12px;
    }

    .probability-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .probability-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .percent {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .main-actions {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 120px 96px;
      gap: 10px;
      margin-top: 16px;
    }

    .spin-btn {
      min-height: 54px;
      border-color: var(--main-dark);
      background: var(--main);
      color: white;
      font-size: 18px;
    }

    .spin-btn:hover {
      background: var(--main-dark);
    }

    .sub-btn {
      padding: 0 12px;
    }

    .small-btn {
      min-height: 36px;
      padding: 0 12px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 0 11px;
      font-size: 14px;
      font-weight: 800;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--main);
    }

    .item-list {
      display: grid;
      gap: 8px;
      max-height: min(58vh, 620px);
      overflow: auto;
      padding-right: 4px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 76px 38px 38px;
      gap: 8px;
      align-items: center;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 8px;
    }

    .item-row.off {
      opacity: 0.5;
    }

    .item-row input[type="text"],
    .item-row input[type="number"] {
      height: 36px;
    }

    .active-wrap {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .active-wrap input {
      width: 18px;
      height: 18px;
      accent-color: var(--main);
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px 72px;
      gap: 8px;
      margin-top: 14px;
    }

    .add-form button {
      border: 1px solid var(--main-dark);
      border-radius: 8px;
      background: var(--main);
      color: white;
      font-weight: 900;
    }

    .history-list {
      display: grid;
      gap: 8px;
      min-height: 88px;
      max-height: 260px;
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
    }

    .history-list li {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 8px;
      font-size: 14px;
    }

    .history-name {
      overflow: hidden;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 72px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-weight: 900;
    }

    .data-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .theme-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 900;
    }

    dialog {
      width: min(420px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .result-body {
      display: grid;
      gap: 14px;
      place-items: center;
      padding: 28px 18px 18px;
      text-align: center;
    }

    .result-label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    #resultText {
      max-width: 100%;
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(30px, 8vw, 52px);
      line-height: 1.05;
    }

    #resultMeta {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: -18px;
      width: 10px;
      height: 16px;
      border-radius: 2px;
      animation: fall 900ms cubic-bezier(0.16, 0.88, 0.32, 1) forwards;
    }

    @keyframes fall {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translate3d(var(--drift), 105vh, 0) rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 1120px) {
      .grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr);
      }

      .side-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 900px) {
      .app {
        padding: 14px;
      }

      .top {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
      }

      .wheel-menu {
        grid-template-columns: minmax(0, 1fr) 40px 40px 40px;
      }

      .wheel-menu label {
        grid-column: 1 / -1;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .main-actions,
      .option-grid,
      .data-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .app {
        padding: 12px;
      }

      h1 {
        font-size: 36px;
      }

      .panel {
        padding: 10px;
      }

      .wheel-menu {
        grid-template-columns: minmax(0, 1fr) repeat(3, 36px);
        gap: 6px;
      }

      .tool-btn {
        width: 36px;
        min-height: 36px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .save-status {
        min-width: 0;
        text-align: left;
      }

      .pointer {
        right: -6px;
        border-top-width: 13px;
        border-bottom-width: 13px;
        border-right-width: 24px;
      }

      .center {
        width: 28%;
        border-width: 6px;
      }

      .probability {
        grid-template-columns: 74px minmax(0, 1fr);
        gap: 10px;
      }

      .mini-pie {
        width: 74px;
        border-width: 4px;
      }

      .probability-list {
        grid-template-columns: 1fr;
      }

      .item-row {
        grid-template-columns: 36px minmax(0, 1fr) 70px 36px 36px;
        gap: 6px;
      }

      .add-form {
        grid-template-columns: minmax(0, 1fr) 76px;
      }

      .add-form button {
        grid-column: 1 / -1;
        min-height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo">
        <p>localStorage roulette</p>
        <h1>ルーレット</h1>
      </div>

      <div class="wheel-menu">
        <label for="wheelSelect">保存リスト</label>
        <select id="wheelSelect"></select>
        <button id="newWheelBtn" class="tool-btn" type="button" title="新規ルーレット">＋</button>
        <button id="copyWheelBtn" class="tool-btn" type="button" title="複製">⧉</button>
        <button id="deleteWheelBtn" class="tool-btn danger" type="button" title="削除">×</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <div class="row">
          <input id="wheelName" class="wheel-name" type="text" maxlength="32" aria-label="ルーレット名" />
          <div id="saveStatus" class="save-status">保存済み</div>
        </div>

        <div class="wheel-box">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="720" height="720"></canvas>
          <div class="center">
            <div>
              <strong id="remainingCount">0</strong>
              <span>候補</span>
            </div>
          </div>
        </div>

        <div class="probability">
          <div id="probabilityChart" class="mini-pie"></div>
          <div>
            <div class="probability-title">当選確率</div>
            <div id="probabilityList" class="probability-list"></div>
          </div>
        </div>

        <div class="main-actions">
          <button id="spinBtn" class="spin-btn" type="button">回す</button>
          <button id="resetActiveBtn" class="sub-btn" type="button">除外を戻す</button>
          <button id="resetAllBtn" class="sub-btn" type="button">初期化</button>
        </div>

        <div class="option-grid">
          <label class="check"><input id="soundToggle" type="checkbox" />効果音</label>
          <label class="check"><input id="confettiToggle" type="checkbox" />紙吹雪</label>
          <label class="check"><input id="avoidRepeatToggle" type="checkbox" />連続当選を抑える</label>
          <label class="check"><input id="autoExcludeToggle" type="checkbox" />当選後に除外</label>
        </div>
      </section>

      <section class="panel">
        <div class="row">
          <h2>項目</h2>
          <button id="randomItemBtn" class="small-btn" type="button">ランダム追加</button>
        </div>

        <div id="itemList" class="item-list"></div>

        <form id="addItemForm" class="add-form">
          <input id="newItemName" type="text" placeholder="項目名" maxlength="40" autocomplete="off" />
          <input id="newItemWeight" type="number" min="1" max="100" step="1" value="1" aria-label="当選倍率" />
          <button type="submit">追加</button>
        </form>
      </section>

      <section class="panel side-panel">
        <div class="row">
          <h2>履歴</h2>
          <button id="clearHistoryBtn" class="small-btn" type="button">消去</button>
        </div>
        <ol id="historyList" class="history-list"></ol>

        <div class="row" style="margin-top: 22px;">
          <h2>データ</h2>
        </div>
        <div class="data-actions">
          <button id="exportBtn" class="sub-btn" type="button">エクスポート</button>
          <button id="importBtn" class="sub-btn" type="button">インポート</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>

        <label class="theme-row" for="themeSelect">
          <span>テーマ</span>
          <select id="themeSelect">
            <option value="clean">Clean</option>
            <option value="festival">Festival</option>
            <option value="night">Night</option>
          </select>
        </label>
      </section>
    </main>
  </div>

  <dialog id="resultDialog">
    <div class="result-body">
      <p class="result-label">当選</p>
      <h2 id="resultText"></h2>
      <div id="resultMeta"></div>
      <button id="closeResultBtn" class="spin-btn" type="button" style="width: min(220px, 100%);">OK</button>
    </div>
  </dialog>

  <div id="confettiLayer" class="confetti-layer"></div>

  <script>
    "use strict";

    const STORAGE_KEY = "easy-roulette-app-v1";
    const colors = ["#e94b35", "#2364aa", "#00a676", "#f0b84b", "#8a5cf6", "#d23f6f", "#1b998b", "#ef8354"];
    const randomNames = ["大当たり", "もう一回", "質問タイム", "休憩", "チャレンジ", "ボーナス", "司会者賞", "ラッキー"];

    const el = {
      wheelSelect: document.getElementById("wheelSelect"),
      newWheelBtn: document.getElementById("newWheelBtn"),
      copyWheelBtn: document.getElementById("copyWheelBtn"),
      deleteWheelBtn: document.getElementById("deleteWheelBtn"),
      wheelName: document.getElementById("wheelName"),
      saveStatus: document.getElementById("saveStatus"),
      canvas: document.getElementById("wheelCanvas"),
      remainingCount: document.getElementById("remainingCount"),
      probabilityChart: document.getElementById("probabilityChart"),
      probabilityList: document.getElementById("probabilityList"),
      spinBtn: document.getElementById("spinBtn"),
      resetActiveBtn: document.getElementById("resetActiveBtn"),
      resetAllBtn: document.getElementById("resetAllBtn"),
      soundToggle: document.getElementById("soundToggle"),
      confettiToggle: document.getElementById("confettiToggle"),
      avoidRepeatToggle: document.getElementById("avoidRepeatToggle"),
      autoExcludeToggle: document.getElementById("autoExcludeToggle"),
      randomItemBtn: document.getElementById("randomItemBtn"),
      itemList: document.getElementById("itemList"),
      addItemForm: document.getElementById("addItemForm"),
      newItemName: document.getElementById("newItemName"),
      newItemWeight: document.getElementById("newItemWeight"),
      historyList: document.getElementById("historyList"),
      clearHistoryBtn: document.getElementById("clearHistoryBtn"),
      exportBtn: document.getElementById("exportBtn"),
      importBtn: document.getElementById("importBtn"),
      importFile: document.getElementById("importFile"),
      themeSelect: document.getElementById("themeSelect"),
      resultDialog: document.getElementById("resultDialog"),
      resultText: document.getElementById("resultText"),
      resultMeta: document.getElementById("resultMeta"),
      closeResultBtn: document.getElementById("closeResultBtn"),
      confettiLayer: document.getElementById("confettiLayer"),
    };

    const ctx = el.canvas.getContext("2d");
    let state = loadState();
    let rotation = 0;
    let spinning = false;
    let audioContext = null;

    function createId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return String(Date.now() + Math.random());
    }

    function createItem(name, color, weight = 1) {
      return {
        id: createId(),
        name,
        color,
        weight,
        active: true,
      };
    }

    function defaultState() {
      return {
        currentWheelId: "main",
        theme: "clean",
        wheels: [
          {
            id: "main",
            name: "今日の抽選",
            options: {
              sound: true,
              confetti: true,
              avoidRepeat: true,
              autoExclude: false,
            },
            items: [
              createItem("A賞", colors[0], 1),
              createItem("B賞", colors[1], 1),
              createItem("C賞", colors[2], 1),
              createItem("もう一回", colors[3], 1),
              createItem("参加賞", colors[4], 2),
            ],
            history: [],
          },
        ],
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultState();
        const data = JSON.parse(saved);
        if (!data.wheels || !Array.isArray(data.wheels) || data.wheels.length === 0) {
          return defaultState();
        }
        return data;
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      el.saveStatus.textContent = "保存済み";
      clearTimeout(saveState.timer);
      saveState.timer = setTimeout(() => {
        el.saveStatus.textContent = "自動保存";
      }, 900);
    }

    function currentWheel() {
      return state.wheels.find((wheel) => wheel.id === state.currentWheelId) || state.wheels[0];
    }

    function activeItems() {
      return currentWheel().items.filter((item) => item.active && item.name.trim());
    }

    function render() {
      const wheel = currentWheel();
      const active = activeItems();

      document.body.dataset.theme = state.theme;
      el.themeSelect.value = state.theme;

      el.wheelSelect.innerHTML = state.wheels
        .map((wheelItem) => `<option value="${escapeHtml(wheelItem.id)}">${escapeHtml(wheelItem.name || "無題")}</option>`)
        .join("");
      el.wheelSelect.value = state.currentWheelId;

      el.wheelName.value = wheel.name;
      el.soundToggle.checked = wheel.options.sound;
      el.confettiToggle.checked = wheel.options.confetti;
      el.avoidRepeatToggle.checked = wheel.options.avoidRepeat;
      el.autoExcludeToggle.checked = wheel.options.autoExclude;

      el.remainingCount.textContent = active.length;
      el.spinBtn.disabled = spinning || active.length === 0;
      el.resetActiveBtn.disabled = wheel.items.every((item) => item.active);
      el.deleteWheelBtn.disabled = state.wheels.length <= 1;

      renderItems();
      renderHistory();
      renderProbability();
      drawWheel();
    }

    function renderItems() {
      const wheel = currentWheel();

      if (wheel.items.length === 0) {
        el.itemList.innerHTML = `<div class="empty">項目なし</div>`;
        return;
      }

      el.itemList.innerHTML = wheel.items
        .map((item) => `
          <div class="item-row ${item.active ? "" : "off"}" data-id="${escapeHtml(item.id)}">
            <input class="item-color" type="color" value="${escapeHtml(item.color)}" aria-label="色" />
            <input class="item-name" type="text" value="${escapeHtml(item.name)}" maxlength="40" aria-label="項目名" />
            <input class="item-weight" type="number" min="1" max="100" step="1" value="${item.weight}" aria-label="当選倍率" />
            <label class="active-wrap" title="抽選に入れる">
              <input class="item-active" type="checkbox" ${item.active ? "checked" : ""} />
            </label>
            <button class="tool-btn danger delete-item" type="button" title="削除">×</button>
          </div>
        `)
        .join("");
    }

    function renderHistory() {
      const history = currentWheel().history;

      if (history.length === 0) {
        el.historyList.innerHTML = `<li class="empty">履歴なし</li>`;
        return;
      }

      el.historyList.innerHTML = history
        .slice(0, 12)
        .map((item) => `
          <li>
            <span class="dot" style="background:${escapeHtml(item.color)}"></span>
            <span class="history-name">${escapeHtml(item.name)}</span>
            <time class="history-time">${formatTime(item.time)}</time>
          </li>
        `)
        .join("");
    }

    function renderProbability() {
      const items = activeItems();

      if (items.length === 0) {
        el.probabilityChart.style.background = "conic-gradient(#b9c0ca 0deg 360deg)";
        el.probabilityList.innerHTML = `<div class="empty">候補なし</div>`;
        return;
      }

      const total = items.reduce((sum, item) => sum + toWeight(item.weight), 0);
      let cursor = 0;
      const segments = items.map((item) => {
        const start = cursor;
        const end = cursor + (toWeight(item.weight) / total) * 360;
        cursor = end;
        return `${item.color} ${start.toFixed(2)}deg ${end.toFixed(2)}deg`;
      });

      el.probabilityChart.style.background = `conic-gradient(${segments.join(", ")})`;
      el.probabilityList.innerHTML = items
        .map((item) => {
          const percent = (toWeight(item.weight) / total) * 100;
          return `
            <div class="probability-item">
              <span class="dot" style="background:${escapeHtml(item.color)}"></span>
              <span class="probability-name">${escapeHtml(item.name)}</span>
              <span class="percent">${percent.toFixed(percent < 10 ? 1 : 0)}%</span>
            </div>
          `;
        })
        .join("");
    }

    function drawWheel(highlightId = null) {
      const items = activeItems();
      const drawItems = items.length
        ? items
        : [createItem("項目を追加", "#b9c0ca", 1), createItem("回せます", "#e1d4b7", 1)];

      const total = drawItems.reduce((sum, item) => sum + toWeight(item.weight), 0);
      const size = el.canvas.width;
      const center = size / 2;
      const radius = center - 18;

      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(rotation);

      let angle = 0;
      drawItems.forEach((item) => {
        const slice = (Math.PI * 2 * toWeight(item.weight)) / total;
        const start = angle;
        const end = angle + slice;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();

        ctx.lineWidth = highlightId === item.id ? 8 : 3;
        ctx.strokeStyle = highlightId === item.id ? "#ffffff" : "rgba(255,255,255,0.72)";
        ctx.stroke();

        drawText(item.name, start + slice / 2, radius);
        angle = end;
      });

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.lineWidth = 14;
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--text").trim();
      ctx.stroke();

      ctx.restore();
    }

    function drawText(text, angle, radius) {
      ctx.save();
      ctx.rotate(angle);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = 3;
      ctx.font = "800 27px system-ui, sans-serif";
      const shortText = text.length > 14 ? text.slice(0, 13) + "..." : text;
      ctx.fillText(shortText, radius - 32, 0);
      ctx.restore();
    }

    function spin() {
      const items = activeItems();
      if (spinning || items.length === 0) return;

      spinning = true;
      render();
      playSpinSound();

      const winner = pickWinner(items);
      const targetAngle = getWinnerAngle(winner);
      const current = normalizeAngle(rotation);
      const desired = normalizeAngle(0 - targetAngle);
      const delta = normalizeAngle(desired - current);
      const turns = 6 + Math.floor(Math.random() * 3);
      const startRotation = rotation;
      const finalRotation = rotation + turns * Math.PI * 2 + delta;
      const duration = 4200 + Math.random() * 900;
      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        rotation = startRotation + (finalRotation - startRotation) * eased;
        drawWheel(progress > 0.92 ? winner.id : null);

        if (progress < 1) {
          requestAnimationFrame(animate);
          return;
        }

        rotation = normalizeAngle(finalRotation);
        finishSpin(winner);
      }

      requestAnimationFrame(animate);
    }

    function pickWinner(items) {
      const wheel = currentWheel();
      const lastName = wheel.history[0]?.name;
      const weighted = items.map((item) => {
        const repeatPenalty = wheel.options.avoidRepeat && items.length > 1 && item.name === lastName ? 0.15 : 1;
        return {
          item,
          weight: toWeight(item.weight) * repeatPenalty,
        };
      });

      const total = weighted.reduce((sum, item) => sum + item.weight, 0);
      let point = Math.random() * total;

      for (const entry of weighted) {
        point -= entry.weight;
        if (point <= 0) return entry.item;
      }

      return weighted[weighted.length - 1].item;
    }

    function getWinnerAngle(winner) {
      const items = activeItems();
      const total = items.reduce((sum, item) => sum + toWeight(item.weight), 0);
      let angle = 0;

      for (const item of items) {
        const slice = (Math.PI * 2 * toWeight(item.weight)) / total;
        if (item.id === winner.id) {
          return angle + slice * (0.24 + Math.random() * 0.52);
        }
        angle += slice;
      }

      return 0;
    }

    function finishSpin(winner) {
      const wheel = currentWheel();

      wheel.history.unshift({
        id: createId(),
        name: winner.name,
        color: winner.color,
        weight: winner.weight,
        time: Date.now(),
      });
      wheel.history = wheel.history.slice(0, 50);

      if (wheel.options.autoExclude) {
        const item = wheel.items.find((entry) => entry.id === winner.id);
        if (item) item.active = false;
      }

      spinning = false;
      playWinSound();
      if (wheel.options.confetti) showConfetti(winner.color);

      el.resultText.textContent = winner.name;
      el.resultMeta.textContent = `当選倍率 ${winner.weight}${wheel.options.autoExclude ? " / 除外済み" : ""}`;

      if (typeof el.resultDialog.showModal === "function") {
        el.resultDialog.showModal();
      } else {
        alert(`当選: ${winner.name}`);
      }

      render();
      saveState();
      drawWheel(winner.id);
    }

    function showConfetti(mainColor) {
      el.confettiLayer.innerHTML = "";
      const confettiColors = [mainColor, "#2364aa", "#f0b84b", "#00a676", "#ffffff", "#d23f6f"];
      const count = window.matchMedia("(max-width: 760px)").matches ? 56 : 90;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = confettiColors[i % confettiColors.length];
        piece.style.animationDelay = Math.random() * 180 + "ms";
        piece.style.setProperty("--drift", Math.random() * 220 - 110 + "px");
        el.confettiLayer.append(piece);
      }

      setTimeout(() => {
        el.confettiLayer.innerHTML = "";
      }, 1500);
    }

    function playSpinSound() {
      if (!currentWheel().options.sound) return;
      const audio = getAudio();
      if (!audio) return;

      const now = audio.currentTime;
      for (let i = 0; i < 12; i++) {
        tone(380 + i * 18, now + i * 0.07, 0.035, 0.035);
      }
    }

    function playWinSound() {
      if (!currentWheel().options.sound) return;
      const audio = getAudio();
      if (!audio) return;

      const now = audio.currentTime;
      tone(523.25, now, 0.12, 0.08);
      tone(659.25, now + 0.11, 0.12, 0.08);
      tone(783.99, now + 0.22, 0.18, 0.08);
    }

    function getAudio() {
      try {
        audioContext ||= new AudioContext();
        return audioContext;
      } catch {
        return null;
      }
    }

    function tone(frequency, start, duration, volume) {
      const audio = getAudio();
      if (!audio) return;

      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function addItem(name, weight) {
      const cleanName = String(name || "").trim();
      if (!cleanName) return;

      const wheel = currentWheel();
      wheel.items.push(createItem(cleanName, colors[wheel.items.length % colors.length], toWeight(weight)));
      render();
      saveState();
    }

    function addRandomItem() {
      const wheel = currentWheel();
      const base = randomNames[Math.floor(Math.random() * randomNames.length)];
      const sameCount = wheel.items.filter((item) => item.name.startsWith(base)).length;
      addItem(sameCount ? `${base} ${sameCount + 1}` : base, Math.ceil(Math.random() * 3));
    }

    function createWheel(name = "新しいルーレット", source = null) {
      const id = createId();
      const wheel = source
        ? structuredClone(source)
        : {
            name,
            options: {
              sound: true,
              confetti: true,
              avoidRepeat: true,
              autoExclude: false,
            },
            items: [
              createItem("A賞", colors[0], 1),
              createItem("B賞", colors[1], 1),
              createItem("C賞", colors[2], 1),
            ],
            history: [],
          };

      wheel.id = id;
      wheel.name = name;
      wheel.history = [];
      wheel.items = wheel.items.map((item, index) => ({
        ...item,
        id: createId(),
        color: item.color || colors[index % colors.length],
      }));

      state.wheels.push(wheel);
      state.currentWheelId = id;
      rotation = 0;
      render();
      saveState();
    }

    function resetActive() {
      currentWheel().items.forEach((item) => {
        item.active = true;
      });
      render();
      saveState();
    }

    function resetAll() {
      if (!confirm("現在のルーレットを初期化しますか？")) return;

      const wheel = currentWheel();
      wheel.items = [
        createItem("A賞", colors[0], 1),
        createItem("B賞", colors[1], 1),
        createItem("C賞", colors[2], 1),
        createItem("もう一回", colors[3], 1),
        createItem("参加賞", colors[4], 2),
      ];
      wheel.history = [];
      wheel.options.autoExclude = false;
      rotation = 0;
      render();
      saveState();
    }

    function deleteCurrentWheel() {
      if (state.wheels.length <= 1) return;
      const wheel = currentWheel();
      if (!confirm(`「${wheel.name}」を削除しますか？`)) return;

      state.wheels = state.wheels.filter((item) => item.id !== wheel.id);
      state.currentWheelId = state.wheels[0].id;
      rotation = 0;
      render();
      saveState();
    }

    function updateItem(row) {
      const wheel = currentWheel();
      const item = wheel.items.find((entry) => entry.id === row.dataset.id);
      if (!item) return;

      item.color = row.querySelector(".item-color").value;
      item.name = row.querySelector(".item-name").value.trim() || "無題";
      item.weight = toWeight(row.querySelector(".item-weight").value);
      item.active = row.querySelector(".item-active").checked;

      render();
      saveState();
    }

    function deleteItem(row) {
      const wheel = currentWheel();
      wheel.items = wheel.items.filter((item) => item.id !== row.dataset.id);
      render();
      saveState();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `roulette-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const data = JSON.parse(String(reader.result || ""));
          if (!data.wheels || !Array.isArray(data.wheels)) throw new Error("invalid");
          state = data;
          rotation = 0;
          render();
          saveState();
        } catch {
          alert("インポートできないJSONです。");
        }
      });
      reader.readAsText(file);
    }

    function toWeight(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 1;
      return Math.min(100, Math.max(1, Math.round(number)));
    }

    function normalizeAngle(value) {
      const circle = Math.PI * 2;
      return ((value % circle) + circle) % circle;
    }

    function formatTime(time) {
      return new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(time));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    el.spinBtn.addEventListener("click", spin);
    el.resetActiveBtn.addEventListener("click", resetActive);
    el.resetAllBtn.addEventListener("click", resetAll);
    el.randomItemBtn.addEventListener("click", addRandomItem);
    el.newWheelBtn.addEventListener("click", () => createWheel());
    el.copyWheelBtn.addEventListener("click", () => createWheel(currentWheel().name + " コピー", currentWheel()));
    el.deleteWheelBtn.addEventListener("click", deleteCurrentWheel);
    el.exportBtn.addEventListener("click", exportData);
    el.importBtn.addEventListener("click", () => el.importFile.click());
    el.importFile.addEventListener("change", (event) => importData(event.target.files[0]));
    el.closeResultBtn.addEventListener("click", () => el.resultDialog.close());

    el.clearHistoryBtn.addEventListener("click", () => {
      currentWheel().history = [];
      render();
      saveState();
    });

    el.wheelSelect.addEventListener("change", (event) => {
      state.currentWheelId = event.target.value;
      rotation = 0;
      render();
      saveState();
    });

    el.wheelName.addEventListener("input", (event) => {
      currentWheel().name = event.target.value.trim() || "無題";
      render();
      saveState();
    });

    el.themeSelect.addEventListener("change", (event) => {
      state.theme = event.target.value;
      render();
      saveState();
    });

    [
      [el.soundToggle, "sound"],
      [el.confettiToggle, "confetti"],
      [el.avoidRepeatToggle, "avoidRepeat"],
      [el.autoExcludeToggle, "autoExclude"],
    ].forEach(([checkbox, key]) => {
      checkbox.addEventListener("change", (event) => {
        currentWheel().options[key] = event.target.checked;
        render();
        saveState();
      });
    });

    el.addItemForm.addEventListener("submit", (event) => {
      event.preventDefault();
      addItem(el.newItemName.value, el.newItemWeight.value);
      el.newItemName.value = "";
      el.newItemWeight.value = "1";
      el.newItemName.focus();
    });

    el.itemList.addEventListener("input", (event) => {
      const row = event.target.closest(".item-row");
      if (row) updateItem(row);
    });

    el.itemList.addEventListener("change", (event) => {
      const row = event.target.closest(".item-row");
      if (row) updateItem(row);
    });

    el.itemList.addEventListener("click", (event) => {
      const button = event.target.closest(".delete-item");
      if (!button) return;
      deleteItem(button.closest(".item-row"));
    });

    window.addEventListener("resize", drawWheel);

    render();
    saveState();
  </script>
</body>
</html>
