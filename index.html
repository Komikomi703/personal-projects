<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalStorage Roulette</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">localStorage roulette</p>
          <h1>ルーレット</h1>
        </div>

        <div class="top-actions">
          <label class="select-label" for="wheelSelect">保存リスト</label>
          <select id="wheelSelect"></select>
          <button id="newWheelBtn" class="tool-button" type="button" title="新規ルーレット" aria-label="新規ルーレット">
            ＋
          </button>
          <button id="duplicateWheelBtn" class="tool-button" type="button" title="複製" aria-label="複製">
            ⧉
          </button>
          <button id="deleteWheelBtn" class="tool-button danger" type="button" title="削除" aria-label="削除">
            ×
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="wheel-panel" aria-label="ルーレット">
          <div class="wheel-title-row">
            <input id="wheelName" class="wheel-name-input" type="text" maxlength="32" aria-label="ルーレット名" />
            <div id="saveStatus" class="save-status">保存済み</div>
          </div>

          <div class="wheel-frame">
            <div class="pointer" aria-hidden="true"></div>
            <canvas id="wheelCanvas" width="720" height="720"></canvas>
            <div class="center-cap">
              <span id="remainingCount">0</span>
              <small>候補</small>
            </div>
          </div>

          <div class="primary-actions">
            <button id="spinBtn" class="spin-button" type="button">回す</button>
            <button id="resetActiveBtn" class="secondary-button" type="button">除外を戻す</button>
            <button id="resetAllBtn" class="secondary-button" type="button">初期化</button>
          </div>

          <div class="option-grid">
            <label class="toggle-line">
              <input id="soundToggle" type="checkbox" />
              <span>効果音</span>
            </label>
            <label class="toggle-line">
              <input id="confettiToggle" type="checkbox" />
              <span>紙吹雪</span>
            </label>
            <label class="toggle-line">
              <input id="avoidRepeatToggle" type="checkbox" />
              <span>連続当選を抑える</span>
            </label>
            <label class="toggle-line">
              <input id="autoExcludeToggle" type="checkbox" />
              <span>当選後に除外</span>
            </label>
          </div>
        </section>

        <section class="editor-panel" aria-label="項目編集">
          <div class="panel-heading">
            <h2>項目</h2>
            <div class="inline-actions">
              <button id="addItemBtn" class="small-button" type="button">追加</button>
              <button id="randomItemBtn" class="small-button" type="button">ランダム</button>
            </div>
          </div>

          <div id="itemList" class="item-list"></div>

          <form id="addItemForm" class="add-form">
            <input id="newItemName" type="text" placeholder="項目名" maxlength="40" autocomplete="off" />
            <input id="newItemWeight" type="number" min="1" max="100" step="1" value="1" aria-label="当選倍率" />
            <button type="submit">追加</button>
          </form>
        </section>

        <section class="side-panel" aria-label="履歴と設定">
          <div class="panel-heading">
            <h2>履歴</h2>
            <button id="clearHistoryBtn" class="small-button" type="button">消去</button>
          </div>
          <ol id="historyList" class="history-list"></ol>

          <div class="panel-heading data-heading">
            <h2>データ</h2>
